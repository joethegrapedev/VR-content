name: Decompile Game Assembly

# Stage 1a of the rebuild (see docs/REBUILD_BRIEF.md).
# Decompiles Assembly-CSharp.dll to C# at a language version Unity 2021.3 can
# actually compile (C# 9). Needs NO Unity license and NO secrets.
# Asset/scene extraction is handled separately (AssetRipper, run locally).

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-project.yml'

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-managed-${{ github.sha }}
          restore-keys: lfs-

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      # Only the managed assemblies are needed here (~75 MB), not the 1.7 GB of
      # scene/asset data. Keeps the run fast and off the LFS bandwidth budget.
      - name: Fetch only the managed assemblies from LFS
        run: |
          set -euo pipefail
          git lfs pull --include="RSAF_VRWarehouse_Data/Managed/*" --exclude=""
          ls -la RSAF_VRWarehouse_Data/Managed/Assembly-CSharp.dll
          test "$(head -c 2 RSAF_VRWarehouse_Data/Managed/Assembly-CSharp.dll)" = "MZ" \
            || { echo "FAIL: LFS content did not materialise"; exit 1; }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install ilspycmd
        run: |
          set -euo pipefail
          dotnet tool install -g ilspycmd
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Show supported language versions
        run: ilspycmd --help 2>&1 | grep -iA3 "languageversion" || true

      # Unity 2021.3 compiles C# 9. ILSpy defaults to the latest C# it knows,
      # which emits primary constructors / file-scoped namespaces that Unity
      # 2021.3 cannot parse. Pin the language version or the output is unusable.
      - name: Decompile Assembly-CSharp.dll at C# 9
        run: |
          set -euo pipefail
          mkdir -p decompiled
          ilspycmd -p -lv CSharp9_0 -o decompiled \
            RSAF_VRWarehouse_Data/Managed/Assembly-CSharp.dll
          echo "--- .cs files ---"
          find decompiled -name '*.cs' | wc -l

      - name: Guard against too-new C# syntax
        run: |
          set -uo pipefail
          echo "Scanning for constructs Unity 2021.3 (C# 9) cannot compile..."
          FAIL=0
          # Primary constructors on class/struct, e.g. "public struct Foo(Bar b)"
          if grep -rnE '^\s*(public|internal|private|protected).*(class|struct)\s+\w+\s*\(' \
               --include='*.cs' decompiled | grep -v 'record' | head -20 | grep .; then
            echo "::error::primary constructors found (C# 12) — language version not applied"
            FAIL=1
          fi
          # File-scoped namespaces, e.g. "namespace Foo;"
          if grep -rnE '^namespace\s+[A-Za-z0-9_.]+\s*;\s*$' --include='*.cs' decompiled | head -10 | grep .; then
            echo "::error::file-scoped namespaces found (C# 10)"
            FAIL=1
          fi
          if [ "$FAIL" -eq 0 ]; then echo "OK: no obviously-too-new syntax detected"; fi
          exit $FAIL

      - name: Inventory
        if: always()
        run: |
          set -uo pipefail
          {
            echo "# Decompile inventory"
            echo
            echo "## Counts"
            echo "- .cs files: $(find decompiled -name '*.cs' 2>/dev/null | wc -l)"
            echo "- total LOC: $(find decompiled -name '*.cs' -exec cat {} + 2>/dev/null | wc -l)"
            echo
            echo "## Namespace folders"
            find decompiled -maxdepth 2 -type d 2>/dev/null | sort | head -40
            echo
            echo "## Largest files"
            find decompiled -name '*.cs' -exec wc -l {} + 2>/dev/null | sort -rn | head -25
          } | tee inventory.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decompiled-sources-csharp9
          path: |
            decompiled/
            inventory.md
          if-no-files-found: error
